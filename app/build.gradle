plugins {
    id 'com.android.application'
}

// Release signing credentials live in keystore.properties, which is never committed.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

// All four must be present and non-blank before release signing is wired up.
def signingKeys = ["storeFile", "storePassword", "keyAlias", "keyPassword"]
def filledKeys = signingKeys.findAll { keystoreProperties[it]?.trim() }
def hasSigningConfig = filledKeys.size() == signingKeys.size()
if (!filledKeys.isEmpty() && !hasSigningConfig) {
    throw new GradleException(
            "keystore.properties is incomplete - missing or blank: " +
            (signingKeys - filledKeys).join(", "))
}

android {
    namespace 'edu.acg.taxidodger'
    // Compile with the latest to see new warnings/features
    compileSdk 36

    defaultConfig {
        applicationId "edu.acg.taxidodger"
        minSdk 24
        // Play requires 36 for any update submitted after 2026-08-31
        targetSdk 36

        versionCode 3
        versionName "1.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            // Left unconfigured when keystore.properties is absent, so the
            // project still syncs and debug builds still work.
            if (hasSigningConfig) {
                storeFile file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasSigningConfig ? signingConfigs.release : null
        }
    }

    compileOptions {
        // Keeps Java 8 compatibility
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Updated libraries to versions that support SDK 34/35
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
